# ============================================================================
# CI — vérifie chaque push et chaque pull request AVANT le déploiement Vercel :
# lint, types, tests unitaires et build de production.
# Le build utilise des valeurs factices : les pages qui lisent la base
# (sitemap, catégories) ont un repli sans données, aucun secret n'est requis.
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Jeton GitHub en lecture seule (audit VULN-013) ; actions épinglées par empreinte de commit
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: cle-factice-ci
      SUPABASE_SERVICE_ROLE_KEY: cle-factice-ci
      NEXT_PUBLIC_SITE_URL: https://getplanmymeal.com
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  # Parcours navigateur (Playwright). Les secrets E2E_EMAIL / E2E_PASSWORD et
  # les clés Supabase de test sont à ajouter dans Settings → Secrets du dépôt :
  # sans eux, le parcours connecté est ignoré (skip) et seules les pages
  # publiques sont vérifiées. Non bloquant tant que les secrets manquent.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://exemple.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'cle-factice-ci' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'cle-factice-ci' }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
